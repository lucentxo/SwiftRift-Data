name: Update meta data

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:
    inputs:
      max_requests:
        description: "Request budget per platform for this run"
        default: "100000"
      platforms:
        description: "Platforms to crawl in parallel"
        default: "na1,euw1,kr,eun1"
      aggregate_only:
        description: "Re-aggregate existing records without crawling"
        type: boolean
        default: false

concurrency:
  group: update-meta
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Crawl and aggregate
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          MAX_REQUESTS: ${{ github.event.inputs.max_requests || '100000' }}
          RIOT_PLATFORMS: ${{ github.event.inputs.platforms || 'na1,euw1,kr,eun1' }}
          MAX_HOURS: "5.2"
        run: |
          if [ "${{ github.event.inputs.aggregate_only }}" = "true" ]; then
            python pipeline/crawl.py --aggregate-only
          else
            python pipeline/crawl.py
          fi
      - name: Commit data
        run: |
          git config user.name "swiftrift-data-bot"
          git config user.email "swiftrift-data-bot@users.noreply.github.com"
          git add manifest.json data state
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update meta data ($(date -u +%Y-%m-%dT%H:%MZ))"
            # Code may have been pushed during a long crawl; rebase onto it so the data isn't lost.
            for attempt in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && break
              sleep 10
            done
          fi
      - name: Purge changed files from the jsDelivr cache
        if: success()
        run: |
          for file in $(git diff --name-only HEAD~1 HEAD -- manifest.json data 2>/dev/null); do
            curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/$file" > /dev/null || true
          done
